version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mka_mysql
    restart: always
    environment:
      MYSQL_DATABASE: mka_db
      MYSQL_ROOT_PASSWORD: rootpassword123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mka_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://root:rootpassword123@db:3306/mka_db
    depends_on:
      - db

  frontend:
    image: nginx:alpine
    container_name: mka_frontend
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./imagen:/usr/share/nginx/html/imagen

volumes:
  mysql_data: