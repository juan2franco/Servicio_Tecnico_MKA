services:
  db:
    image: mysql:8.0
    container_name: mka_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: mka_db
      MYSQL_ROOT_PASSWORD: rootpassword123
    ports:
      # 3316 en el PC: el 3306 lo usa el MySQL de Windows y el 3307 otro servicio
      - "3316:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword123"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mka_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://root:rootpassword123@db:3306/mka_db
      - MKA_SIN_SQLITE=1      # en Docker siempre MySQL, nunca la base de respaldo
      - MKA_EN_DOCKER=1       # la base de datos se ve con Adminer
    volumes:
      - ./frontend:/frontend:ro          # panel en http://localhost:8000/app/
      - ./herramientas:/herramientas:ro  # enlace publico (boton Compartir)
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: nginx:alpine
    container_name: mka_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./imagen:/usr/share/nginx/html/imagen

  adminer:
    # Ver la base de datos en http://localhost:8081 (el 8080 ya lo usa otro Adminer)
    # Servidor: db   Usuario: root   Clave: la de MYSQL_ROOT_PASSWORD   Base: mka_db
    image: adminer
    container_name: mka_adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db

volumes:
  mysql_data:
